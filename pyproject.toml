[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sub-checker"
version = "0.1.0"
description = "Pre-submission manuscript checker powered by Claude agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "odafeng" },
]
keywords = [
    "academic",
    "manuscript",
    "submission",
    "checker",
    "agent",
    "claude",
    "proofreading",
    "citation",
    "journal",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "click>=8.0",
    "python-docx>=1.0",
    "anthropic>=0.30",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.8",
    "pyright>=1.1",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/odafeng/sub-checker"
Repository = "https://github.com/odafeng/sub-checker"
Issues = "https://github.com/odafeng/sub-checker/issues"

[project.scripts]
sub-check = "sub_checker.cli:main"

# ── Ruff ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"src/sub_checker/api.py" = ["E402"]  # _load_dotenv() must run before imports

[tool.ruff.lint.isort]
known-first-party = ["sub_checker"]

# ── Pyright ───────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = false

# ── Pytest ────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
