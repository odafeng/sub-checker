repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/RobertCraiworthy/pyright-python
    rev: v1.1.394
    hooks:
      - id: pyright
        additional_dependencies:
          - click>=8.0
          - python-docx>=1.0
          - anthropic>=0.30
          - httpx>=0.27
          - pydantic>=2.0
          - pyyaml>=6.0
          - rich>=13.0
